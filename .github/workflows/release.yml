name: Release

on:
  push:
    tags: ["v*"]      # 例如 git tag v1.0.1 && git push origin v1.0.1

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set version from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content nffinance/version.py) -replace '__version__ = ".*"', "__version__ = `"$v`"" | Set-Content nffinance/version.py
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build exe (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed --name NoodleFunFinance
          --icon assets/icon.ico --add-data "assets;assets" run.py

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer.iss

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash Output/NoodleFunFinance-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  NoodleFunFinance-Setup.exe" | Out-File Output/NoodleFunFinance-Setup.exe.sha256 -Encoding ascii

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/NoodleFunFinance-Setup.exe
            Output/NoodleFunFinance-Setup.exe.sha256
          generate_release_notes: true
